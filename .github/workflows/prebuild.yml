name: Generate Scarlet IPA Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Compile Native iOS Simulator App
        run: |
          xcodebuild -workspace ios/*.xcworkspace \
                     -scheme Onam2026 \
                     -sdk iphonesimulator \
                     -configuration Release \
                     derivedDataPath build

      - name: Structure Bundle into Scarlet Payload Format
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphonesimulator/*.app Payload/
          zip -r EXAMATE.ipa Payload

      - name: Upload Finished IPA File
        uses: actions/upload-artifact@v4
        with:
          name: Scarlet-Ready-IPA
          path: EXAMATE.ipa
