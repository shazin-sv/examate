name: Generate Scarlet IPA Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm install

      - name: Generate Native iOS Folder in Cloud
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Compile Native iOS Simulator App
        run: |
          # Automatically select your actual application scheme
          SCHEME_NAME=$(xcodebuild -list -workspace ios/*.xcworkspace | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | sed 's/^[[:space:]]*//' | grep -v 'Expo' | head -n 1)
          if [ -z "$SCHEME_NAME" ]; then SCHEME_NAME="Onam2026"; fi
          echo "Building scheme: $SCHEME_NAME"
          
          xcodebuild -workspace ios/*.xcworkspace \
                     -scheme "$SCHEME_NAME" \
                     -sdk iphonesimulator \
                     -configuration Release \
                     -derivedDataPath build

      - name: Structure Bundle into Scarlet Payload Format
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphonesimulator/*.app Payload/
          zip -r EXAMATE.ipa Payload

      - name: Upload Finished IPA File
        uses: actions/upload-artifact@v4
        with:
          name: Scarlet-Ready-IPA
          path: EXAMATE.ipa
